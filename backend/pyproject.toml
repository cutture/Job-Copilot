[project]
name = "job-copilot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "litellm>=1.106.6",
    "psycopg[binary]>=3.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["job_copilot", "tests"]
