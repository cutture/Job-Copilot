# Local mode: only the dashboard is published, and only to this machine.
x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql://job_copilot:${POSTGRES_PASSWORD:-job_copilot}@db:5432/job_copilot
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: job_copilot
      POSTGRES_DB: job_copilot
      # ponytail: default password, safe only because the port isn't published; VPS mode must set it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_copilot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_copilot -d job_copilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn job_copilot.api:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: python -m job_copilot.worker
    environment:
      DATABASE_URL: postgresql://job_copilot:${POSTGRES_PASSWORD:-job_copilot}@db:5432/job_copilot
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8765}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
