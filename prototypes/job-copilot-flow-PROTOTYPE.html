<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PROTOTYPE: Job Copilot flow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1f2933;background:#f4f5f7;padding-bottom:170px}
header{background:#fff;border-bottom:1px solid #d9dde3;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 4px}
main{padding:14px 20px;max-width:1280px;margin:auto}.card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:14px;margin-bottom:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:#e4e7eb}
.proto{background:#fff3c4;color:#6b4e00}.High{background:#dff5e3;color:#14622a}.Medium{background:#fff3c4;color:#6b4e00}.Low{background:#fdecea;color:#8a1c12}
.warn{background:#fdecea;border:1px solid #f0b8b2;border-radius:8px;padding:10px 14px;margin-bottom:12px}.note{background:#e3edff;border:1px solid #b6ccf2;border-radius:8px;padding:10px 14px;margin-bottom:12px}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #9aa5b1;border-radius:6px;background:#fff;cursor:pointer;margin:2px 2px 2px 0}
button.primary{background:#1f5fbf;border-color:#1f5fbf;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
button.danger{border-color:#b3261e;color:#8a1c12}:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 2px}label.inline{display:inline;font-weight:400;font-size:14px}
input[type=text],select,textarea{font:inherit;width:100%;padding:5px 8px;border:1px solid #9aa5b1;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.split{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:14px;align-items:start}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #e4e7eb}.row:first-child{border-top:0}
.muted{color:#52606d;font-size:13px}.quote{border-left:3px solid #9aa5b1;padding-left:8px;color:#3e4c59;margin:4px 0}
.funnel{display:flex;gap:8px;flex-wrap:wrap}.funnel div{background:#f4f5f7;border-radius:6px;padding:4px 12px;font-size:13px}.funnel b{font-size:17px;display:block}
.job{cursor:default}.job.sel{outline:2px solid #1f5fbf}.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button[aria-selected=true]{background:#1f2933;color:#fff}
.doc{font-family:Georgia,serif;max-width:680px}.doc h4{margin:12px 0 2px;border-bottom:1px solid #9aa5b1;font-size:14px}.doc ul{margin:4px 0;padding-left:20px}
.un{background:#fdecea;border-bottom:2px solid #b3261e;padding:0 2px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:7px;border-top:1px solid #e4e7eb;vertical-align:top}th{font-size:13px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1f2933;color:#fff;padding:8px 14px;z-index:5;font-size:13px}.bar button[aria-pressed=true]{background:#f0a500;border-color:#f0a500;font-weight:700}
pre{background:#111;color:#b6f2c0;margin:6px 0 0;padding:6px 8px;font-size:12px;max-height:70px;overflow:auto;white-space:pre-wrap}
@media(max-width:850px){.grid2,.split{grid-template-columns:1fr}}
</style></head><body>
<header><span class="badge proto">PROTOTYPE: invented data, nothing is saved or sent</span><h1>Job Copilot</h1>
<nav aria-label="Screens" id="nav"></nav></header><main id="app"></main>
<div class="bar" role="region" aria-label="Layout switcher"><div id="sw"></div><pre id="state" aria-label="Current state"></pre></div>
<script>
const R=(name,kind,result,quote,ev,self)=>({name,kind,result,quote,ev,self});
const JOBS=[
{id:"j1",t:"Senior GenAI Engineer",e:"Northwind Labs",src:"Greenhouse (Watchlist)",type:"Employment",loc:"Remote, US",band:"High",status:"open",stale:false,why:["All must-haves are backed by Evidence","Seniority fits","2 of 3 nice-to-haves met"],gaps:["Terraform: no Evidence found"],reqs:[R("Production LLM experience","Must-have","Met","You have shipped LLM features to production.","GitHub: srivera/support-drafter"),R("3+ years of Python","Must-have","Met","3+ years of Python","Resume: Python Developer, 2021 to present"),R("Evaluating LLM output","Must-have","Met","Experience evaluating model output.","Profile entry",1),R("Terraform","Nice-to-have","Unknown","Terraform a plus","")]},
{id:"j2",t:"LLM Platform Engineer",e:"Contoso AI",src:"Greenhouse (Watchlist)",type:"Employment",loc:"Remote, US",band:"Medium",status:"open",stale:false,why:["Held back by one must-have: Kubernetes has no Evidence","Python and LLM work are covered"],gaps:["Kubernetes: no Evidence found"],reqs:[R("Kubernetes","Must-have","Missing","Must have run services on Kubernetes.",""),R("Production LLM experience","Must-have","Met","Production LLM systems","GitHub: srivera/support-drafter"),R("Python","Must-have","Met","Strong Python","Resume: Python Developer, 2021 to present")]},
{id:"j3",t:"AI Evaluation Contractor",e:"Fabrikam Studio",src:"Jobicy",type:"Freelance",loc:"Remote",band:"Medium",status:"open",stale:false,why:["Held back: the posting lists fewer than three clear requirements","Evaluation experience is covered"],gaps:[],reqs:[R("Evaluating LLM output","Must-have","Met","Evaluate our chatbot's answers.","Profile entry",1)]},
{id:"j4",t:"Staff ML Scientist",e:"Tailspin Research",src:"Pasted by you",type:"Employment",loc:"Washington, DC",band:"Low",status:"open",stale:false,why:["Hard blocker: active security clearance required","PhD: no Evidence found"],gaps:["Security clearance","PhD"],reqs:[R("Active security clearance","Hard blocker","Missing","Active clearance required.",""),R("PhD","Must-have","Missing","PhD required.","")]},
{id:"j5",t:"Applied AI Engineer",e:"Adventure Works",src:"Ashby (Watchlist)",type:"Employment",loc:"Remote, US",band:"High",status:"submitted",days:16,stale:false,why:["All must-haves are backed by Evidence"],gaps:[],reqs:[R("LLM experience","Must-have","Met","LLM experience","GitHub: srivera/support-drafter")],outcome:null}
];
const FILTERED=[{t:"Data Engineer",e:"Example GmbH",why:"Posting is not written in English"},{t:"Senior AI Engineer",e:"Example Ltd",why:"Remote role clearly requires residence in the UK"}];
const CLAIMS={c1:{text:"Built a LangGraph pipeline that drafts support replies",src:"GitHub: srivera/support-drafter, README",quote:"LangGraph workflow that drafts replies for human review.",req:"Production LLM experience"},c2:{text:"5 years of Python",src:"Resume: Python Developer, 2021 to present",quote:"Python Developer, Jan 2021 to present",req:"3+ years of Python"},c3:{text:"Ran evaluations with DeepEval",src:"Profile entry (self-reported)",quote:"I set up DeepEval for my team's chatbot.",req:"Evaluating LLM output"}};
const REMOVED=[{id:"r1",text:"Reduced support costs by 40%",why:"No Evidence mentions a cost figure."},{id:"r2",text:"Led a team of six engineers",why:"Evidence shows team membership, not leadership."}];
const qs=new URLSearchParams(location.search);
const S={screen:qs.get("screen")||"profile",layout:{profile:qs.get("profile")||"a",jobs:qs.get("jobs")||"a"},step:0,resume:"",github:"srivera",evidence:[{text:"Resume: Python Developer, 2021 to present",k:"Resume"},{text:"GitHub: srivera/support-drafter",k:"Public GitHub"},{text:"I set up DeepEval for my team's chatbot.",k:"Self-reported"}],draft:"",saved:false,auth:"",watch:["Northwind Labs (Greenhouse)","Contoso AI (Greenhouse)"],watchIn:"",watchMsg:"",paste:"",pasteMsg:"",schedule:false,runs:3,searchMsg:"",open:{},sel:"j1",picked:{},confirm:null,showLow:false,showFiltered:false,emailAsked:false,emailOn:null,job:null,tab:"Documents",doc:"Resume",claim:"c1",kept:{},pendingKeep:null,reviewed:false,version:1,changes:[],changeIn:"",spend:2.4,applyClicks:1};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const J=id=>JOBS.find(j=>j.id==id);
const openJobs=()=>JOBS.filter(j=>j.status=="open");const est=n=>"$"+(n*0.002).toFixed(3);
function funnel(){const sub=JOBS.filter(j=>j.status=="submitted"),i=sub.filter(j=>j.outcome=="Interview"||j.outcome=="Offer").length,o=sub.filter(j=>j.outcome=="Offer").length,rep=sub.filter(j=>j.outcome).length;
 return `<div class="funnel"><div><b>${JOBS.length}</b>Matches</div><div><b>${S.applyClicks}</b>Apply clicks (${Math.round(S.applyClicks/JOBS.length*100)}%)</div><div><b>${sub.length}</b>Submitted</div><div><b>${i}</b>Interviews, self-reported</div><div><b>${o}</b>Offers</div><div><b>${sub.length-rep}</b>No outcome reported yet</div></div>`}
function jobActions(j){if(j.status=="open")return `<button class="primary" data-apply="${j.id}">Apply</button><button data-rescore="${j.id}">Rescore</button>`;if(j.status=="pack")return `<button class="primary" data-apply="${j.id}">Open Application Pack</button>`;return ""}
function outcomes(j){if(j.status!="submitted")return "";const o=["Interview","Offer","Rejected","No response"];return `<div><span class="muted">${j.days?`Submitted ${j.days} days ago. `:"Submitted. "}Outcome:</span> ${o.map(x=>`<button aria-pressed="${j.outcome==x}" data-out="${j.id}|${x}">${j.outcome==x?"✓ ":""}${x}</button>`).join("")}</div>`}
function reqs(j){return `<table><tr><th>Requirement</th><th>Result</th><th>Evidence</th></tr>${j.reqs.map((r,i)=>`<tr><td><b>${esc(r.name)}</b> <span class="muted">${r.kind}</span><div class="quote">${esc(r.quote)}</div></td><td>${r.result}${r.self?" (self-reported)":""}</td><td>${r.ev?esc(r.ev):`<span class="muted">No Evidence found</span><br><button data-addev="${j.id}|${i}">Add to Profile</button>`}</td></tr>`).join("")}</table><p class="muted">Rating saved at Apply. ${j.src=="Pasted by you"?"":"Source: "+esc(j.src)+"."}</p>`}
function jobHead(j,pick=true){return `<div style="display:flex;gap:8px;align-items:flex-start">${pick&&j.status=="open"&&j.stale?`<input type="checkbox" aria-label="Select ${esc(j.t)} to rescore" data-pick="${j.id}" ${S.picked[j.id]?"checked":""}>`:""}<div><b>${esc(j.t)}</b>, ${esc(j.e)} <span class="badge ${j.band}">${j.band}</span> <span class="badge">${j.type}</span>${j.stale?' <span class="badge Medium">Profile changed</span>':""}${j.status=="pack"?' <span class="badge">Pack ready</span>':""}${j.status=="submitted"?' <span class="badge">Submitted</span>':""}<div class="muted">${esc(j.loc)} · ${esc(j.src)}</div></div></div>`}
function sources(){return `<div class="grid2"><div class="card"><h2>Search</h2><button class="primary" id="search" ${S.runs?"":"disabled"}>Search now</button> <span class="muted">${S.runs} of 5 runs left today</span><br><label class="inline"><input type="checkbox" id="sched" ${S.schedule?"checked":""}> Also search every day at 8:00</label><p class="muted">${esc(S.searchMsg)||"Sources: Greenhouse Watchlist, Jobicy, pasted postings."}</p><div class="muted">Paid API use: $${S.spend.toFixed(2)} of $10.00 this month</div></div><div class="card"><h2>Add a job source</h2><label for="wi">Add an employer to your Watchlist</label><input type="text" id="wi" data-bind="watchIn" placeholder="Paste a careers page URL" value="${esc(S.watchIn)}"><button id="wadd">Add employer</button><div class="muted">${esc(S.watchMsg)||esc(S.watch.join(", "))}</div><label for="pi">Paste a Job Posting</label><div class="note" style="margin:0 0 4px;padding:6px 10px;font-size:13px">Paste only from an employer's own career page, not sites like LinkedIn, Indeed or Upwork. The text goes to an LLM provider.</div><textarea id="pi" data-bind="paste" rows="2">${esc(S.paste)}</textarea><button id="padd">Add posting</button> <span class="muted">${esc(S.pasteMsg)}</span></div></div>`}
function banners(){let h="";const due=JOBS.filter(j=>j.status=="submitted"&&j.days>=14&&!j.outcome);
 if(due.length)h+=`<div class="note"><b>Did you hear back?</b> ${due.map(j=>`<div>${esc(j.t)} at ${esc(j.e)}: ${outcomes(j)}</div>`).join("")}</div>`;
 if(S.emailAsked&&S.emailOn===null)h+=`<div class="note"><b>Want a reminder by email?</b> We can email you once, 14 days after you submit, to ask if you heard back. It needs an SMTP account in Profile. <div><button id="emailYes">Yes, remind me</button><button id="emailNo">No thanks</button></div></div>`;
 const stale=openJobs().filter(j=>j.stale);
 if(stale.length){const n=Object.keys(S.picked).filter(k=>S.picked[k]).length;h+=`<div class="warn"><b>Your Profile changed.</b> ${stale.length} open Matches may be out of date. Nothing is rescored automatically. <div><button id="pickAll">Select all</button><button id="rescorePicked" ${n?"":"disabled"}>Rescore ${n} selected (about ${est(n)})</button></div></div>`}
 if(S.confirm)h+=`<div class="warn"><b>Rescore ${S.confirm.length} Match${S.confirm.length>1?"es":""}?</b> Estimated cost ${est(S.confirm.length)}. Requirements are reused, so only the judging step runs. <div><button class="primary" id="rcYes">Rescore</button><button id="rcNo">Cancel</button></div></div>`;
 return h}
function filtered(){return `<div class="card"><button id="tf" aria-expanded="${S.showFiltered}">${S.showFiltered?"Hide":"Show"} ${FILTERED.length} filtered postings</button>${S.showFiltered?FILTERED.map(f=>`<div class="row"><div>${esc(f.t)}, ${esc(f.e)}<br><span class="muted">${esc(f.why)}</span></div></div>`).join(""):""}</div>`}
const order=b=>JOBS.filter(j=>j.band==b);
function card(j){return `<div class="card job">${jobHead(j)}<ul style="margin:6px 0;padding-left:20px">${j.why.slice(0,3).map(w=>`<li>${esc(w)}</li>`).join("")}</ul>${j.gaps.length?`<div class="muted">Gaps: ${esc(j.gaps.join(", "))}</div>`:""}${outcomes(j)}<div>${jobActions(j)}<button data-open="${j.id}" aria-expanded="${!!S.open[j.id]}">${S.open[j.id]?"Hide details":"Details"}</button></div>${S.open[j.id]?reqs(j):""}</div>`}
const JobsA=()=>`<div class="card">${funnel()}</div>${sources()}${banners()}${["High","Medium"].map(b=>`<h2>${b} (${order(b).length})</h2>${order(b).map(card).join("")}`).join("")}<div class="card"><button id="tl" aria-expanded="${S.showLow}">${S.showLow?"Hide":"Show"} Low (${order("Low").length})</button></div>${S.showLow?order("Low").map(card).join(""):""}${filtered()}<p class="muted">Interview Likelihood is an estimate of how well your Evidence covers the posting. It doesn't predict the employer's decision.</p>`;
const JobsB=()=>{const j=J(S.sel)||JOBS[0];return `<div class="card">${funnel()}</div>${banners()}<div class="split"><div>${["High","Medium","Low"].map(b=>(b=="Low"&&!S.showLow)?`<button id="tl" aria-expanded="false">Show Low (${order("Low").length})</button>`:`<h3>${b}</h3>`+order(b).map(x=>`<div class="card job ${x.id==j.id?"sel":""}">${jobHead(x)}<button data-sel="${x.id}">View</button></div>`).join("")).join("")}${filtered()}</div><div><div class="card">${jobHead(j,false)}<h3>Why this rating</h3><ul style="margin:0;padding-left:20px">${j.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>${outcomes(j)}<p>${jobActions(j)}</p>${reqs(j)}</div>${sources()}</div></div>`};
function profLeft(){return `<div class="card"><h2>Resume</h2><label for="rf">Upload your resume (PDF or DOCX)</label><button id="upload">Choose file (simulated)</button> <span class="muted">${S.resume?esc(S.resume)+" read: 1 role, 6 skills":"Stays on your server. Used only as Evidence."}</span><label for="gh">Public GitHub username</label><input type="text" id="gh" data-bind="github" value="${esc(S.github)}"><div class="muted">Public repos only.</div></div>`}
function profFacts(){return `<div class="card"><h2>Facts used for hard blockers</h2><p class="muted">An empty field shows as Unknown, never as a blocker.</p><label for="wa">Work authorization</label><select id="wa" data-bind="auth"><option value="">Not set</option><option ${S.auth=="US citizen or permanent resident"?"selected":""}>US citizen or permanent resident</option><option ${S.auth=="Needs sponsorship"?"selected":""}>Needs sponsorship</option></select><label for="loc">Where you live</label><input type="text" id="loc" value="Remote, US"><label for="lang">Languages</label><input type="text" id="lang" value="English"><label for="sen">Seniority</label><select id="sen"><option>Mid</option><option selected>Senior</option><option>Staff</option></select></div>`}
function profSearch(){return `<div class="card"><h2>What you're looking for</h2><label for="roles">Roles and keywords</label><input type="text" id="roles" value="GenAI engineer, LLM engineer"><label for="wt">Work type</label><select id="wt"><option>Employment and freelance</option><option>Employment only</option><option>Freelance only</option></select><label for="sal">Minimum salary (used by Filter)</label><input type="text" id="sal" value="120000"><h3>Location preference</h3><label class="inline"><input type="checkbox" checked> Remote</label> <label class="inline"><input type="checkbox"> Hybrid</label> <label class="inline"><input type="checkbox"> On-site</label><label for="pl">Countries or cities</label><input type="text" id="pl" value="US, San Francisco"><div class="muted">Filter hides postings outside these. You can still view them with the reason.</div></div>`}
function profEv(){return `<div class="card"><h2>Evidence</h2><p class="muted">Every claim in an Application Pack comes from here.</p>${S.evidence.map((e,i)=>`<div class="row"><div>${esc(e.text)} <span class="badge ${e.k=="Self-reported"?"Medium":""}">${esc(e.k)}</span></div><button data-delev="${i}">Remove</button></div>`).join("")}<label for="dr">Add something the resume misses</label><textarea id="dr" data-bind="draft" rows="2" placeholder="For example: I ran services on Kubernetes at Example Co for 2 years.">${esc(S.draft)}</textarea><button id="addev">Add as self-reported</button></div>`}
function profEmail(){return `<div class="card"><h2>Check-in email (optional)</h2><label class="inline"><input type="checkbox" id="em" ${S.emailOn?"checked":""}> Remind me 14 days after I submit</label>${S.emailOn?'<label for="smtp">SMTP server</label><input type="text" id="smtp" value="smtp.example.com"><label for="to">Send to my address</label><input type="text" id="to" value="sam@example.com"><div class="muted">Sends only to you, and names no employers or jobs. Job Copilot never reads your mailbox.</div>':""}</div>`}
const save=()=>`<p><button class="primary" id="saveP">Save Profile</button> <button id="goJobs">Go to job listings</button> <span class="muted">${S.saved?"Saved. Open Matches are marked Profile changed.":""}</span></p>`;
const ProfA=()=>`<div class="grid2"><div>${profLeft()}${profEv()}</div><div>${profFacts()}${profSearch()}${profEmail()}</div></div>${save()}`;
const STEPS=[["Resume and GitHub",()=>profLeft()],["Check your Evidence",()=>profEv()],["Facts",()=>profFacts()],["What you're looking for",()=>profSearch()],["Check-in email",()=>profEmail()]];
const ProfB=()=>`<div class="card" style="max-width:720px;margin:auto"><p class="muted">Step ${S.step+1} of ${STEPS.length}: ${STEPS[S.step][0]}</p></div><div style="max-width:720px;margin:auto">${STEPS[S.step][1]()}<p><button id="pv" ${S.step?"":"disabled"}>Back</button>${S.step<STEPS.length-1?'<button class="primary" id="nx">Next</button>':save()}</p></div>`;
function docResume(){const kept=REMOVED.filter(r=>S.kept[r.id]);return `<div class="doc"><b style="font-size:18px">Sam Rivera</b><br>sam@example.com · Remote, US<h4>Skills</h4><button data-claim="c2">${esc(CLAIMS.c2.text)}</button>, LangGraph, FastAPI<h4>Experience</h4><b>Python Developer</b>, Example Co, Jan 2021 to present<ul><li><button data-claim="c1">${esc(CLAIMS.c1.text)}</button></li><li><button data-claim="c3">${esc(CLAIMS.c3.text)}</button></li>${kept.map(r=>`<li><span class="un">${esc(r.text)}</span> <span class="badge Low">No Evidence: kept by you</span></li>`).join("")}</ul></div>`}
const docCover=()=>`<div class="doc"><p>Dear hiring team,</p><p>Your posting asks for production LLM experience. <button data-claim="c1">${esc(CLAIMS.c1.text)}</button> is my closest example.</p><p>Sincerely,<br>Sam Rivera</p></div>`;
const docAns=()=>`<div class="row"><div><b>Full name</b><br>Sam Rivera</div><button>Copy</button></div><div class="row"><div><b>Work authorization</b><br>${esc(S.auth)||'<span class="muted">Not set in Profile</span>'}</div><button>Copy</button></div><div class="row"><div><b>Gender and ethnicity (voluntary)</b><br><span class="muted">Left for you.</span></div></div>`;
function removedBox(){return `<div class="warn"><h2>Claims without Evidence</h2>${REMOVED.map(r=>`<div class="row"><div>${S.kept[r.id]?esc(r.text):`<s>${esc(r.text)}</s>`} ${S.kept[r.id]?'<span class="badge Low">Kept by you</span>':""}<br><span class="muted">${esc(r.why)}</span>${S.pendingKeep==r.id?`<div style="margin-top:6px"><b>Keep this claim?</b> We found no Evidence for it in your resume or Profile. An employer may ask you to back it up, so keep it only if it's true. <div><button class="danger" data-keepyes="${r.id}">Keep it, it's true</button><button id="keepNo">Cancel</button></div></div>`:""}</div><div style="white-space:nowrap">${S.kept[r.id]?`<button data-undo="${r.id}">Remove again</button>`:`<button data-addclaim="${r.id}">Add Evidence</button><button data-keep="${r.id}">Keep anyway</button>`}</div></div>`).join("")}</div>`}
function coverage(){return `<table><tr><th>Requirement</th><th>Result</th><th>Where the Pack uses it</th></tr>${(S.job?J(S.job):JOBS[0]).reqs.map(r=>`<tr><td><b>${esc(r.name)}</b> <span class="muted">${r.kind}</span></td><td>${r.result}</td><td>${r.ev?"Resume: "+esc(r.ev):'<span class="muted">Not claimed</span>'}</td></tr>`).join("")}</table>`}
const Review=()=>{const j=S.job?J(S.job):JOBS[0],c=CLAIMS[S.claim];const docs={Resume:docResume,"Cover letter":docCover,"Form answers":docAns};return `<p><button id="backJobs">← Back to job listings</button> <span class="muted">Your draft stays saved.</span></p><div class="card"><h2>${esc(j.t)}, ${esc(j.e)} <span class="badge ${j.band}">${j.band}</span></h2><span class="muted">Application Pack version ${S.version}</span></div>${removedBox()}<div class="grid2"><div class="card"><div class="tabs">${["Documents","Requirement coverage"].map(t=>`<button aria-selected="${S.tab==t}" data-tab="${t}">${t}</button>`).join("")}</div>${S.tab=="Documents"?`<div class="tabs">${Object.keys(docs).map(t=>`<button aria-selected="${S.doc==t}" data-doc="${t}">${t}</button>`).join("")}</div>${docs[S.doc]()}`:coverage()}</div><div><div class="card"><h2>Why this claim is here</h2><p>${esc(c.text)}</p><div class="muted">${esc(c.src)}</div><div class="quote">${esc(c.quote)}</div><div class="muted">Answers: ${esc(c.req)}</div></div><div class="card"><h2>Want something different?</h2><label for="ch">Tell us what to change</label><textarea id="ch" data-bind="changeIn" rows="2" placeholder="For example: lead with my evaluation work and shorten the cover letter.">${esc(S.changeIn)}</textarea><button id="regen">Regenerate (about $0.002)</button><button id="pvOpen">Preview final documents</button>${S.version>1?'<button id="prevV">Back to previous version</button>':""}<div class="muted">New claims still go through verification. ${S.changes.map(x=>"Asked: "+esc(x)).join(" ")}</div></div><div class="card"><h2>Finish</h2><label class="inline"><input type="checkbox" id="rev" ${S.reviewed?"checked":""}> I've reviewed this Application Pack</label><p><button ${S.reviewed?"":"disabled"}>Download resume (DOCX)</button><button ${S.reviewed?"":"disabled"}>Download resume (PDF)</button><button ${S.reviewed?"":"disabled"}>Download cover letter (DOCX)</button><button ${S.reviewed?"":"disabled"}>Download cover letter (PDF)</button></p><p><button ${S.reviewed?"":"disabled"}>Open employer's application page</button><button class="primary" id="sub" ${S.reviewed?"":"disabled"}>I submitted it on their site</button></p><p class="muted">Job Copilot never submits for you.</p></div></div></div>`};
const Preview=()=>{const kept=REMOVED.filter(r=>S.kept[r.id]);const d=S.reviewed?"":"disabled";return `<p><button id="pvBack">← Back to changes</button> <span class="muted">Final documents, version ${S.version}, exactly as they will download.</span></p><div class="grid2"><div class="card"><h2>Resume</h2><div class="doc"><b style="font-size:18px">Sam Rivera</b><br>sam@example.com · Remote, US<h4>Skills</h4>${esc(CLAIMS.c2.text)}, LangGraph, FastAPI<h4>Experience</h4><b>Python Developer</b>, Example Co, Jan 2021 to present<ul><li>${esc(CLAIMS.c1.text)}</li><li>${esc(CLAIMS.c3.text)}</li>${kept.map(r=>`<li>${esc(r.text)}</li>`).join("")}</ul><h4>Education</h4>BSc Computer Science, Example University</div><p><button ${d}>Download resume (DOCX)</button><button ${d}>Download resume (PDF)</button></p></div><div class="card"><h2>Cover letter</h2><div class="doc"><p>Dear hiring team,</p><p>Your posting asks for production LLM experience. ${esc(CLAIMS.c1.text)} is my closest example.</p><p>Sincerely,<br>Sam Rivera</p></div><p><button ${d}>Download cover letter (DOCX)</button><button ${d}>Download cover letter (PDF)</button></p></div></div><div class="card">${kept.length?`<div class="warn">Claims in this resume kept by you without Evidence: ${kept.length}. This warning isn't in the file.</div>`:""}<label class="inline"><input type="checkbox" id="rev" ${S.reviewed?"checked":""}> I've reviewed this Application Pack</label></div>`};
const VARS={profile:{a:"Profile A: one page",b:"Profile B: guided steps"},jobs:{a:"Listings A: cards by band",b:"Listings B: list + detail"}};
function render(){const sc=S.screen;const lay=S.layout[sc];document.getElementById("app").innerHTML=sc=="profile"?(lay=="b"?ProfB():ProfA()):sc=="jobs"?(lay=="b"?JobsB():JobsA()):(S.preview?Preview():Review());
 document.getElementById("nav").innerHTML=[["profile","Profile"],["jobs","Job listings"],["review","Application Pack review"]].map(([k,l])=>`<button aria-pressed="${sc==k}" data-screen="${k}" ${sc==k?'style="font-weight:700;background:#e3edff"':""}>${l}</button>`).join("");
 document.getElementById("sw").innerHTML=VARS[sc]?Object.entries(VARS[sc]).map(([k,l])=>`<button aria-pressed="${lay==k}" data-lay="${k}">${l}</button>`).join(""):"This screen has one layout: A with the coverage tab, as you chose.";
 document.getElementById("state").textContent=JSON.stringify({screen:sc,layout:lay,evidence:S.evidence.length,jobs:JOBS.map(j=>[j.id,j.band,j.status,j.stale?"stale":"",j.outcome||""].join(":")),runs:S.runs,schedule:S.schedule,keptWithoutEvidence:Object.keys(S.kept),version:S.version,reviewed:S.reviewed,email:S.emailOn});
 history.replaceState(null,"",`?screen=${sc}&profile=${S.layout.profile}&jobs=${S.layout.jobs}`)}
function markStale(){openJobs().forEach(j=>j.stale=true)}
function rescore(ids){ids.forEach(id=>{const j=J(id);j.stale=false;S.picked[id]=false;S.spend+=0.002;if(j.id=="j2"&&S.evidence.some(e=>/kubernetes/i.test(e.text))){j.reqs[0].result="Met";j.reqs[0].ev="Profile entry";j.reqs[0].self=1;j.band="High";j.why=["All must-haves are backed by Evidence"];j.gaps=[]}})}
document.addEventListener("input",e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b)S[b]=e.target.value});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.bind=="auth"){S.auth=t.value;markStale();render()}else if(t.dataset.pick){S.picked[t.dataset.pick]=t.checked;render()}});
document.addEventListener("click",e=>{const t=e.target,d=t.dataset||{},id=t.id;
 if(d.screen)S.screen=d.screen;else if(d.lay)S.layout[S.screen]=d.lay;
 else if(id=="upload"){S.resume="sam-rivera-resume.pdf"}else if(id=="nx")S.step++;else if(id=="pv")S.step--;
 else if(id=="addev"){if(!S.draft.trim())return;S.evidence.push({text:S.draft.trim(),k:"Self-reported"});S.draft="";markStale()}
 else if(d.delev!==undefined){S.evidence.splice(+d.delev,1);markStale()}
 else if(id=="saveP"){S.saved=true;markStale()}else if(id=="goJobs")S.screen="jobs";
 else if(id=="em"){S.emailOn=t.checked}
 else if(id=="search"){S.runs--;S.searchMsg="Search queued. It will add new Matches and rate them."}
 else if(id=="sched")S.schedule=t.checked;
 else if(id=="wadd"){const u=S.watchIn.trim();if(!u)return;if(/greenhouse|ashby|lever/i.test(u)){S.watch.push(u);S.watchMsg="Added: "+u}else S.watchMsg="This careers page uses a board we don't support yet.";S.watchIn=""}
 else if(id=="padd"){if(!S.paste.trim())return;S.pasteMsg="Added and queued for rating.";S.paste=""}
 else if(d.open)S.open[d.open]=!S.open[d.open];else if(d.sel)S.sel=d.sel;
 else if(id=="tl")S.showLow=!S.showLow;else if(id=="tf")S.showFiltered=!S.showFiltered;
 else if(d.apply){const j=J(d.apply);if(j.status=="open"){j.status="pack";S.applyClicks++;S.spend+=0.002;S.reviewed=false;S.version=1;S.kept={};S.changes=[];S.preview=false}S.job=j.id;S.screen="review"}
 else if(d.rescore)S.confirm=[d.rescore];else if(id=="pickAll"){openJobs().filter(j=>j.stale).forEach(j=>S.picked[j.id]=true)}
 else if(id=="rescorePicked")S.confirm=Object.keys(S.picked).filter(k=>S.picked[k]);
 else if(id=="rcYes"){rescore(S.confirm);S.confirm=null}else if(id=="rcNo")S.confirm=null;
 else if(d.addev){const [jid,i]=d.addev.split("|");S.evidence.push({text:J(jid).reqs[+i].name+": experience (please describe)",k:"Self-reported"});markStale();S.screen="profile"}
 else if(d.out){const [jid,o]=d.out.split("|");J(jid).outcome=J(jid).outcome==o?null:o}
 else if(id=="emailYes"){S.emailOn=true;S.screen="profile"}else if(id=="emailNo")S.emailOn=false;
 else if(id=="backJobs")S.screen="jobs";else if(d.tab)S.tab=d.tab;else if(d.doc)S.doc=d.doc;else if(d.claim)S.claim=d.claim;
 else if(d.keep)S.pendingKeep=d.keep;else if(id=="keepNo")S.pendingKeep=null;else if(d.keepyes){S.kept[d.keepyes]=true;S.pendingKeep=null;S.reviewed=false}
 else if(d.undo){delete S.kept[d.undo];S.reviewed=false}else if(d.addclaim)S.screen="profile";
 else if(id=="regen"){if(!S.changeIn.trim())return;S.changes.push(S.changeIn.trim());S.changeIn="";S.version++;S.spend+=0.002;S.reviewed=false;S.preview=true}
 else if(id=="pvOpen")S.preview=true;else if(id=="pvBack")S.preview=false;
 else if(id=="prevV"){S.version--;S.changes.pop();S.reviewed=false}
 else if(id=="rev")S.reviewed=t.checked;
 else if(id=="sub"){const j=S.job?J(S.job):null;if(j){j.status="submitted";j.days=0;j.outcome=null;if(S.emailOn===null)S.emailAsked=true}S.screen="jobs";S.job=null;S.preview=false}
 else return;render()});
render();
</script></body></html>
