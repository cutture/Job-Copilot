<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PROTOTYPE 2: Job listings</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1f2933;background:#f4f5f7;padding-bottom:170px}
header{background:#fff;border-bottom:1px solid #d9dde3;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 6px}h3{font-size:13px;margin:10px 0 4px;color:#52606d;text-transform:uppercase;letter-spacing:.03em}
main{padding:14px 20px;max-width:1280px;margin:auto}.card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:12px;margin-bottom:10px}.card.sel{outline:2px solid #1f5fbf}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:#e4e7eb;margin-right:3px}.High,.g{background:#dff5e3;color:#14622a}.Medium,.y{background:#fff3c4;color:#6b4e00}.Low,.r{background:#fdecea;color:#8a1c12}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #9aa5b1;border-radius:6px;background:#fff;cursor:pointer;margin:2px 2px 2px 0}.primary{background:#1f5fbf;border-color:#1f5fbf;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
input[type=text]{font:inherit;padding:4px 8px;border:1px solid #9aa5b1;border-radius:6px}.muted{color:#52606d;font-size:13px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.funnel{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.funnel span{background:#f4f5f7;border-radius:6px;padding:2px 10px;font-size:13px}
.msg{border-radius:8px;padding:10px 14px;margin-bottom:10px;border:1px solid}.info{background:#e3edff;border-color:#b6ccf2}.bad{background:#fdecea;border-color:#f0b8b2}.warn{background:#fff8e1;border-color:#e8d48a}
.split{display:grid;grid-template-columns:minmax(300px,2fr) 3fr;gap:12px;align-items:start}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}.col{background:#e9ebef;border-radius:8px;padding:8px;min-height:200px}
table{border-collapse:collapse;width:100%;background:#fff}td,th{text-align:left;padding:7px 8px;border-top:1px solid #e4e7eb;vertical-align:top;font-size:14px}th{font-size:13px}.quote{border-left:3px solid #9aa5b1;padding-left:8px;color:#3e4c59}
.empty{text-align:center;padding:48px 20px}.spin{display:inline-block;width:12px;height:12px;border:2px solid #9aa5b1;border-top-color:#1f5fbf;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1f2933;color:#fff;padding:8px 14px;font-size:13px}.bar button[aria-pressed=true]{background:#f0a500;border-color:#f0a500;font-weight:700}pre{background:#111;color:#b6f2c0;margin:6px 0 0;padding:6px 8px;font-size:12px;max-height:54px;overflow:auto;white-space:pre-wrap}
@media(max-width:900px){.split,.kanban{grid-template-columns:1fr}}
</style></head><body>
<header><span class="badge y">PROTOTYPE: invented data, nothing is saved</span><h1>Job listings</h1><nav><a href="1-profile-setup-PROTOTYPE.html">← Profile</a> · <a href="3-final-documents-PROTOTYPE.html">Final documents →</a></nav></header>
<main id="app"></main><div class="bar" role="region" aria-label="Layout and page state switcher"><div id="sw"></div><div id="sw2" style="margin-top:4px"></div><pre id="state"></pre></div>
<script>
const JOBS=[
{id:"j1",t:"Senior GenAI Engineer",e:"Northwind Labs",src:"Greenhouse",type:"Employment",band:"High",st:"open",why:["All must-haves are backed by Evidence","Seniority fits"],gap:"Terraform: no Evidence found",req:[["Production LLM experience","Must-have","Met","GitHub: srivera/support-drafter"],["3+ years of Python","Must-have","Met","Resume: Python Developer"],["Terraform","Nice-to-have","Unknown",""]]},
{id:"j2",t:"LLM Platform Engineer",e:"Contoso AI",src:"Greenhouse",type:"Employment",band:"Medium",st:"open",why:["Held back by one must-have: Kubernetes","Python and LLM work are covered"],gap:"Kubernetes: no Evidence found",req:[["Kubernetes","Must-have","Missing",""],["Python","Must-have","Met","Resume: Python Developer"]]},
{id:"j3",t:"AI Evaluation Contractor",e:"Fabrikam Studio",src:"Jobicy",type:"Freelance",band:"Medium",st:"generating",why:["Held back: fewer than three clear requirements"],gap:"",req:[["Evaluating LLM output","Must-have","Met","Profile entry (self-reported)"]]},
{id:"j4",t:"Staff ML Scientist",e:"Tailspin Research",src:"Pasted by you",type:"Employment",band:"Low",st:"open",why:["Hard blocker: active security clearance required"],gap:"Security clearance, PhD",req:[["Security clearance","Hard blocker","Missing",""]]},
{id:"j5",t:"Applied AI Engineer",e:"Adventure Works",src:"Ashby",type:"Employment",band:"High",st:"pack",why:["All must-haves are backed by Evidence"],gap:"",req:[["LLM experience","Must-have","Met","GitHub: srivera/support-drafter"]]},
{id:"j6",t:"GenAI Developer",e:"Wide World Co",src:"Greenhouse",type:"Employment",band:"High",st:"submitted",days:16,why:["All must-haves are backed by Evidence"],gap:"",req:[["LLM experience","Must-have","Met","Profile entry (self-reported)"]]},
{id:"j7",t:"Prompt Engineer",e:"Litware",src:"Greenhouse",type:"Employment",band:"Medium",st:"submitted",days:30,outcome:"Interview",why:["One must-have is Partial"],gap:"",req:[["Prompt evaluation","Must-have","Partial","Profile entry (self-reported)"]]},
{id:"j8",t:"AI Engineer",e:"Proseware",src:"Jobicy",type:"Employment",band:"Medium",st:"submitted",days:40,outcome:"Rejected",expired:true,why:["Rating saved at Apply"],gap:"",req:[["Python","Must-have","Met","Resume: Python Developer"]]}
];
const STATES={results:"Results",first:"First run: no search yet",searching:"Search running",none:"No Matches found",stale:"Profile changed",cap:"$10 cap reached",limit:"Daily run limit reached",source:"A source failed"};
const qs=new URLSearchParams(location.search);
const S={v:qs.get("v")||"a",page:qs.get("state")||"results",sel:"j1",open:{},low:false,filtered:false,picked:{},confirm:null,add:false,asked:false,email:null};
const J=i=>JOBS.find(j=>j.id==i),list=()=>S.page=="first"||S.page=="none"?[]:JOBS;
const stale=j=>S.page=="stale"&&j.st=="open";
const capped=()=>S.page=="cap";
function badges(j){return `<span class="badge ${j.band}">${j.band}</span><span class="badge">${j.type}</span>${stale(j)?'<span class="badge y">Profile changed</span>':""}${j.st=="generating"?'<span class="badge"><span class="spin"></span> Writing Pack</span>':""}${j.st=="pack"?'<span class="badge g">Pack ready</span>':""}${j.st=="submitted"?'<span class="badge">Submitted</span>':""}${j.outcome?`<span class="badge ${j.outcome=="Rejected"?"r":"g"}">${j.outcome}</span>`:""}${j.expired?'<span class="badge">Posting expired</span>':""}`}
function actions(j){if(j.st=="open")return `<button class="primary" data-go="${j.id}">Apply</button><button data-rs="${j.id}">Rescore</button>${capped()?'<div class="muted">Will use the free fallback model.</div>':""}`;if(j.st=="generating")return '<button disabled>Writing Pack…</button>';if(j.st=="pack")return `<a href="3-final-documents-PROTOTYPE.html"><button class="primary">Open Application Pack</button></a>`;return `<div class="muted">${j.days} days ago. Outcome:</div>${["Interview","Offer","Rejected","No response"].map(o=>`<button aria-pressed="${j.outcome==o}" data-out="${j.id}|${o}">${j.outcome==o?"✓ ":""}${o}</button>`).join("")}`}
const pick=j=>stale(j)?`<input type="checkbox" aria-label="Select ${j.t}" data-pick="${j.id}" ${S.picked[j.id]?"checked":""}> `:"";
const reqs=j=>`<table><tr><th>Requirement</th><th>Result</th><th>Evidence</th></tr>${j.req.map(r=>`<tr><td><b>${r[0]}</b><br><span class="muted">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]||'<span class="muted">No Evidence found</span><br><button data-profile="1">Add to Profile</button>'}</td></tr>`).join("")}</table>`;
function funnel(){const l=list(),a=l.filter(j=>j.st!="open").length,s=l.filter(j=>j.st=="submitted"),i=s.filter(j=>j.outcome=="Interview"||j.outcome=="Offer").length,u=s.filter(j=>!j.outcome).length;return `<div class="funnel"><span><b>${l.length}</b> Matches</span><span><b>${a}</b> Apply clicks</span><span><b>${s.length}</b> Submitted</span><span><b>${i}</b> Interviews, self-reported</span><span><b>${u}</b> no outcome yet</span></div>`}
function topBar(){const off=S.page=="limit"||S.page=="searching";return `<div class="card"><div class="top"><button class="primary" id="go" ${off?"disabled":""}>${S.page=="searching"?'<span class="spin"></span> Searching':"Search now"}</button><span class="muted">${S.page=="limit"?"0":"3"} of 5 runs left today</span><label><input type="checkbox"> Search daily at 8:00</label><button id="tadd" aria-expanded="${S.add}">Add a job source</button><span class="muted">Paid API use: $${capped()?"10.00":"2.40"} of $10.00</span></div>${S.add?`<div style="margin-top:8px"><label for="w">Add employer by careers page URL</label><br><input type="text" id="w" size="40"> <button>Add to Watchlist</button><br><label for="p">Paste a Job Posting.</label> <span class="muted">Paste only from an employer's own career page, not sites like LinkedIn, Indeed or Upwork. The text goes to an LLM provider.</span><br><input type="text" id="p" size="40"> <button>Add posting</button></div>`:""}${funnel()}</div>`}
function banners(){let h="";const p=S.page;
 if(p=="searching")h+=`<div class="msg info"><span class="spin"></span> Searching Greenhouse and Jobicy. New Matches appear as they're rated.</div>`;
 if(p=="cap")h+=`<div class="msg bad"><b>You've reached your $10 paid API cap.</b> Scoring and Application Packs now use a free fallback model and are labelled with its name. If it's unavailable, they wait in the queue with a warning.</div>`;
 if(p=="limit")h+=`<div class="msg warn"><b>Today's 5 searches are used.</b> Search is available again tomorrow.</div>`;
 if(p=="source")h+=`<div class="msg warn"><b>Jobicy didn't respond.</b> Greenhouse results are up to date. We'll try Jobicy again on the next run.</div>`;
 if(p=="stale"){const n=Object.values(S.picked).filter(Boolean).length,c=JOBS.filter(stale).length;h+=`<div class="msg warn"><b>Your Profile changed.</b> ${c} open Matches may be out of date. Nothing rescores automatically.<div><button id="all">Select all</button><button id="rsp" ${n?"":"disabled"}>Rescore ${n} selected (about $${(n*.002).toFixed(3)})</button></div></div>`}
 if(S.confirm)h+=`<div class="msg warn"><b>Rescore ${S.confirm.length}?</b> Estimated cost $${(S.confirm.length*.002).toFixed(3)}. <button class="primary" id="ry">Rescore</button><button id="rn">Cancel</button></div>`;
 const due=list().filter(j=>j.st=="submitted"&&j.days>=14&&!j.outcome);
 if(due.length&&p=="results")h+=`<div class="msg info"><b>Did you hear back?</b> ${due.map(j=>`<div>${j.t}, ${j.e}: ${["Interview","Offer","Rejected","No response"].map(o=>`<button data-out="${j.id}|${o}">${o}</button>`).join("")}</div>`).join("")}</div>`;
 if(S.asked&&S.email===null)h+=`<div class="msg info"><b>Want a reminder by email?</b> We'd email you once, 14 days after you submit. <button id="ey">Yes</button><button id="en">No thanks</button></div>`;
 return h}
function empty(){return S.page=="first"?`<div class="card empty"><h2>No jobs yet</h2><p class="muted">Add employers you like, then search. We'll rate every Match against your Evidence.</p><button class="primary" id="go2">Search now</button> <button id="tadd2">Add a job source</button></div>`:`<div class="card empty"><h2>No Matches this time</h2><p class="muted">2 postings were filtered out. Widen your location preference or add employers to your Watchlist.</p><button id="tf">View filtered postings</button></div>${S.filtered?filt():""}`}
const filt=()=>`<div class="card"><h2>Filtered postings</h2><div>Data Engineer, Example GmbH <span class="muted">Not written in English</span></div><div>Senior AI Engineer, Example Ltd <span class="muted">Requires UK residence</span></div></div>`;
const foot=()=>`<div class="card"><button id="tf" aria-expanded="${S.filtered}">${S.filtered?"Hide":"Show"} 2 filtered postings</button></div>${S.filtered?filt():""}<p class="muted">Interview Likelihood estimates how well your Evidence covers the posting. It doesn't predict the employer's decision.</p>`;
function bands(fn){const l=list();return ["High","Medium"].map(b=>`<h3>${b} (${l.filter(j=>j.band==b).length})</h3>${l.filter(j=>j.band==b).map(fn).join("")}`).join("")+(S.low?`<h3>Low</h3>${l.filter(j=>j.band=="Low").map(fn).join("")}`:`<div><button id="tl">Show Low (${l.filter(j=>j.band=="Low").length})</button></div>`)}
const A=()=>{const j=J(S.sel);return `<div class="split"><div>${bands(x=>`<div class="card ${x.id==S.sel?"sel":""}">${pick(x)}<b>${x.t}</b>, ${x.e}<br>${badges(x)}<br><button data-sel="${x.id}">View</button></div>`)}</div><div><div class="card" style="position:sticky;top:8px"><h2>${j.t}, ${j.e}</h2>${badges(j)}<div class="muted">${j.src}</div><ul style="margin:6px 0;padding-left:20px">${j.why.map(w=>`<li>${w}</li>`).join("")}</ul>${j.gap?`<div class="muted">Gaps: ${j.gap}</div>`:""}<p>${actions(j)}</p>${reqs(j)}</div></div></div>${foot()}`};
const B=()=>{const l=list();return `<div class="card" style="padding:0;overflow:auto"><table><tr><th>Job</th><th>Rating</th><th>Why</th><th>Source</th><th>Actions</th></tr>${l.filter(j=>S.low||j.band!="Low").map(j=>`<tr><td>${pick(j)}<b>${j.t}</b><br><span class="muted">${j.e}</span></td><td>${badges(j)}</td><td>${j.why[0]}${j.gap?`<br><span class="muted">Gaps: ${j.gap}</span>`:""}${S.open[j.id]?reqs(j):""}<br><button data-open="${j.id}">${S.open[j.id]?"Hide":"Details"}</button></td><td>${j.src}</td><td style="min-width:170px">${actions(j)}</td></tr>`).join("")}</table></div>${S.low?"":`<button id="tl">Show Low (1)</button>`}${foot()}`};
const COLS=[["To review",j=>j.st=="open"],["Pack in progress",j=>j.st=="generating"||j.st=="pack"],["Submitted",j=>j.st=="submitted"&&!j.outcome],["Outcome",j=>!!j.outcome]];
const C=()=>`<div class="kanban">${COLS.map(([n,f])=>{const c=list().filter(f);return `<div class="col"><h3>${n} (${c.length})</h3>${c.map(j=>`<div class="card">${pick(j)}<b>${j.t}</b><br><span class="muted">${j.e}</span><br>${badges(j)}<div class="muted">${j.why[0]}</div>${actions(j)}<button data-open="${j.id}">${S.open[j.id]?"Hide":"Details"}</button>${S.open[j.id]?reqs(j):""}</div>`).join("")}</div>`}).join("")}</div>${foot()}`;
const V={a:A,b:B,c:C},L={a:"A: List + detail",b:"B: Table",c:"C: Board by progress"};
function render(){if(!V[S.v])S.v="a";if(!STATES[S.page])S.page="results";document.getElementById("app").innerHTML=topBar()+banners()+(list().length?V[S.v]():empty());document.getElementById("sw").innerHTML="Layout: "+Object.entries(L).map(([k,l])=>`<button aria-pressed="${S.v==k}" data-v="${k}">${l}</button>`).join("");document.getElementById("sw2").innerHTML="State: "+Object.entries(STATES).map(([k,l])=>`<button aria-pressed="${S.page==k}" data-page="${k}">${l}</button>`).join("");document.getElementById("state").textContent=JSON.stringify({layout:S.v,state:S.page,selected:S.sel,jobs:JOBS.map(j=>[j.id,j.st,j.outcome||""].join(":")),picked:Object.keys(S.picked).filter(k=>S.picked[k])});history.replaceState(null,"",`?v=${S.v}&state=${S.page}`)}
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.pick){S.picked[t.dataset.pick]=t.checked;render()}});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset,i=t.id;if(d.v)S.v=d.v;else if(d.page){S.page=d.page;S.picked={};S.confirm=null}else if(d.sel)S.sel=d.sel;else if(d.open)S.open[d.open]=!S.open[d.open];else if(i=="tl")S.low=!S.low;else if(i=="tf")S.filtered=!S.filtered;else if(i=="tadd"||i=="tadd2")S.add=!S.add;else if(i=="go"||i=="go2")S.page="searching";else if(d.go){J(d.go).st="generating";S.sel=d.go}else if(d.rs)S.confirm=[d.rs];else if(i=="all")JOBS.filter(stale).forEach(j=>S.picked[j.id]=true);else if(i=="rsp")S.confirm=Object.keys(S.picked).filter(k=>S.picked[k]);else if(i=="ry"||i=="rn"){if(i=="ry"&&S.page=="stale"&&S.confirm.length==JOBS.filter(stale).length)S.page="results";S.confirm=null;S.picked={}}else if(d.out){const[a,o]=d.out.split("|");J(a).outcome=J(a).outcome==o?null:o;if(!S.asked&&S.email===null)S.asked=true}else if(i=="ey")S.email=true;else if(i=="en")S.email=false;else if(d.profile)location.href="1-profile-setup-PROTOTYPE.html";else return;render()});
render();
</script></body></html>
