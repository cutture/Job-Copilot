<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PROTOTYPE 3: Final documents</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1f2933;background:#e9ebef;padding-bottom:140px}
header{background:#fff;border-bottom:1px solid #d9dde3;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 6px}
main{padding:14px 20px;max-width:1320px;margin:auto}.card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:12px;margin-bottom:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:#e4e7eb}.y{background:#fff3c4;color:#6b4e00}.g{background:#dff5e3;color:#14622a}.r{background:#fdecea;color:#8a1c12}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #9aa5b1;border-radius:6px;background:#fff;cursor:pointer;margin:2px 2px 2px 0}.primary{background:#1f5fbf;border-color:#1f5fbf;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
textarea{font:inherit;width:100%;padding:6px 8px;border:1px solid #9aa5b1;border-radius:6px}label{font-size:13px;font-weight:600}label.i{font-weight:400;font-size:14px}.muted{color:#52606d;font-size:13px}
.page{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.25);padding:34px 40px;font-family:Georgia,serif;max-width:620px;min-height:640px;margin:0 auto 14px}.page h4{margin:12px 0 2px;border-bottom:1px solid #52606d;font-size:14px}.page ul{margin:4px 0;padding-left:20px}
.ins{background:#dff5e3;text-decoration:none}.del{background:#fdecea}.un{background:#fdecea;border-bottom:2px solid #b3261e}
.three{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}.docs2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.drawer{position:sticky;top:8px}.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button[aria-selected=true]{background:#1f2933;color:#fff}.dock{max-width:760px;margin:0 auto}.claim{font:inherit;padding:0 2px;margin:0;border:0;border-bottom:1px dotted #1f5fbf;border-radius:0;background:none;text-align:left}.claim.sel{background:#e3edff}
.warn{background:#fdecea;border:1px solid #f0b8b2;border-radius:8px;padding:10px 14px;margin-bottom:10px}.info{background:#e3edff;border:1px solid #b6ccf2;border-radius:8px;padding:10px 14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #e4e7eb}.row:first-child{border-top:0}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1f2933;color:#fff;padding:8px 14px;font-size:13px;z-index:3}.bar button[aria-pressed=true]{background:#f0a500;border-color:#f0a500;font-weight:700}pre{background:#111;color:#b6f2c0;margin:6px 0 0;padding:6px 8px;font-size:12px;max-height:44px;overflow:auto;white-space:pre-wrap}
@media(max-width:900px){.three,.docs2{grid-template-columns:1fr}.page{padding:20px}.dock{position:static}}
</style></head><body>
<header><span class="badge y">PROTOTYPE: invented data, nothing is saved or generated</span><h1>Final documents: Senior GenAI Engineer, Northwind Labs</h1><nav><a href="2-job-listings-PROTOTYPE.html">← Job listings</a></nav></header>
<main id="app"></main><div class="bar" role="region" aria-label="Layout switcher"><div id="sw"></div><pre id="state"></pre></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const CL=[{id:"r1",t:"Reduced support costs by 40%",w:"No Evidence mentions a cost figure."},{id:"r2",t:"Led a team of six engineers",w:"Evidence shows team membership, not leadership."}];
const S={v:new URLSearchParams(location.search).get("v")||"b",doc:"Resume",ver:1,asks:[],ask:"",kept:{},pend:null,claim:"c1",view:"Evidence",rev:false,busy:false,submitted:false,flag:null};
const EV={c1:{t:"Built a LangGraph pipeline that drafts support replies",src:"GitHub: srivera/support-drafter, README",quote:"LangGraph workflow that drafts replies for human review.",req:"Production LLM experience"},c2:{t:"Ran evaluations with DeepEval",self:1,src:"Profile entry (self-reported)",quote:"I set up DeepEval for my team's chatbot.",req:"Experience evaluating LLM output"},c3:{t:"5 years of Python",src:"Resume: Python Developer, Jan 2021 to present",quote:"Python Developer, Jan 2021 to present",req:"3+ years of Python"},c4:{t:"my support-drafter project, a LangGraph pipeline where people review every draft",src:"GitHub: srivera/support-drafter, README",quote:"Every draft waits for human review.",req:"Production LLM experience"}};
const REQS=[["Production LLM experience","Must-have","Met",["c1","c4"]],["3+ years of Python","Must-have","Met",["c3"]],["Experience evaluating LLM output","Must-have","Met (self-reported)",["c2"]],["Terraform","Nice-to-have","No Evidence found",[]]];
const cb=id=>`<button class="claim ${S.claim==id?"sel":""}" data-claim="${id}">${EV[id].t}</button>`;
const EvidencePanel=()=>{const c=EV[S.claim];return `<div class="card"><div class="tabs">${["Evidence","Requirement coverage"].map(t=>`<button aria-selected="${S.view==t}" data-view="${t}">${t}</button>`).join("")}</div>${S.view=="Evidence"?`<p class="muted">Click any underlined claim in the documents.</p><b>${c.t}</b> <span class="badge ${c.self?"y":"g"}">${c.self?"Self-reported":"Direct Evidence"}</span><div class="muted">${c.src}</div><div class="muted">Quote: ${c.quote}</div><div class="muted">Answers: ${c.req}</div>`:REQS.map(r=>`<div class="row"><div><b>${r[0]}</b> <span class="muted">${r[1]}</span><br>${r[2]}</div><div>${r[3].length?r[3].map(cb).join("<br>"):'<button data-add="1">Add to Profile</button>'}</div></div>`).join("")}</div>`};
// Version 2 and later show a visible change, so the preview reacts to a request.
const bullets=()=>S.ver>1?["c2","c1"]:["c1","c2"];
const Resume=(mark)=>`<div class="page"><b style="font-size:20px">Sam Rivera</b><br>sam@example.com · Remote, US<h4>Skills</h4>${mark?cb("c3"):EV.c3.t}, LangGraph, FastAPI, Postgres<h4>Experience</h4><b>Python Developer</b>, Example Co, Jan 2021 to present<ul>${bullets().map(b=>`<li>${mark?cb(b):EV[b].t}</li>`).join("")}${CL.filter(c=>S.kept[c.id]).map(c=>`<li>${mark?`<span class="un">${c.t}</span>`:c.t}</li>`).join("")}${S.flag&&S.kept.f?`<li>${mark?`<span class="un">${esc(S.flag)}</span>`:esc(S.flag)}</li>`:""}</ul><h4>Education</h4>BSc Computer Science, Example University</div>`;
const Cover=()=>`<div class="page"><p>Dear Northwind Labs hiring team,</p><p>${S.ver>1?"I'll keep this short.":"I'm applying for the Senior GenAI Engineer role."} Your posting asks for production LLM experience. The closest example is ${cb("c4")}.</p><p>I'd bring the same habit of keeping a person in the loop to your team.</p><p>Sincerely,<br>Sam Rivera</p></div>`;
const Claims=()=>{const items=[...CL];if(S.flag)items.push({id:"f",t:S.flag,w:"Added by your request, and verification found no Evidence."});return `<div class="card"><h2>Claims without Evidence</h2>${items.map(c=>`<div class="row"><div>${S.kept[c.id]?esc(c.t):`<s>${esc(c.t)}</s>`} ${S.kept[c.id]?'<span class="badge r">Kept by you</span>':""}<div class="muted">${c.w}</div>${S.pend==c.id?`<div style="margin-top:4px"><b>Keep this?</b> We found no Evidence in your resume or Profile. Keep it only if it's true.<br><button data-yes="${c.id}">Keep it, it's true</button><button id="no">Cancel</button></div>`:""}</div><div>${S.kept[c.id]?`<button data-un="${c.id}">Remove</button>`:`<button data-add="1">Add Evidence</button><button data-keep="${c.id}">Keep anyway</button>`}</div></div>`).join("")}</div>`};
const Ask=()=>`<div class="card"><label for="ask">What should change?</label><textarea id="ask" data-b rows="2" placeholder="Lead with my evaluation work and shorten the cover letter.">${esc(S.ask)}</textarea><button class="primary" id="go" ${S.busy?"disabled":""}>${S.busy?"Regenerating…":"Regenerate (about $0.002)"}</button>${S.ver>1?'<button id="prev">Back to previous version</button>':""}<div class="muted">Version ${S.ver}. Tone, order, emphasis and length change directly. New facts go through verification.</div>${S.asks.map(a=>`<div class="muted">Asked: ${esc(a)}</div>`).join("")}</div>`;
const Dl=(k)=>{const d=S.rev?"":"disabled";return ({res:`<button ${d}>Resume DOCX</button><button ${d}>Resume PDF</button>`,cov:`<button ${d}>Cover letter DOCX</button><button ${d}>Cover letter PDF</button>`,all:`<button ${d}>Resume DOCX</button><button ${d}>Resume PDF</button><button ${d}>Cover letter DOCX</button><button ${d}>Cover letter PDF</button>`})[k]};
const Finish=()=>`<div class="card"><label class="i"><input type="checkbox" id="rev" ${S.rev?"checked":""}> I've reviewed this Application Pack</label><div>${Dl("all")}</div><div><button ${S.rev?"":"disabled"}>Open employer's application page</button><button class="primary" id="sub" ${S.rev?"":"disabled"}>${S.submitted?"✓ Marked as Submitted":"I submitted it on their site"}</button></div><div class="muted">Job Copilot never submits for you. Red marks appear only here, never in the files.</div></div>`;
const Back=()=>`<p><a href="2-job-listings-PROTOTYPE.html"><button>← Back to job listings</button></a> <span class="muted">Your draft stays saved.</span></p>`;
const B=()=>`${Back()}<div class="info">Preview of both final documents. Underlined claims show their Evidence and appear only here, never in the files. Use the box below the documents to change anything.</div>${Claims()}${EvidencePanel()}<div class="docs2"><div>${Resume(true)}<div class="card">${Dl("res")}</div></div><div>${Cover()}<div class="card">${Dl("cov")}</div></div></div><div class="dock">${Ask()}</div>${Finish()}`;
const V={b:B},L={b:"B: Both documents, change box below (selected)"};
function render(){if(!V[S.v])S.v="b";document.getElementById("app").innerHTML=V[S.v]();document.getElementById("sw").innerHTML=Object.entries(L).map(([k,l])=>`<button aria-pressed="${S.v==k}" data-v="${k}">${l}</button>`).join("");const {ask,...x}=S;document.getElementById("state").textContent=JSON.stringify(x)}
document.addEventListener("input",e=>{if(e.target.id=="ask")S.ask=e.target.value});
document.addEventListener("click",e=>{const t=e.target,d=t.dataset,i=t.id;if(d.v){S.v=d.v;history.replaceState(null,"","?v="+d.v)}else if(d.doc)S.doc=d.doc;else if(d.claim)S.claim=d.claim;else if(d.view)S.view=d.view;else if(d.add)location.href="1-profile-setup-PROTOTYPE.html";else if(d.keep)S.pend=d.keep;else if(i=="no")S.pend=null;else if(d.yes){S.kept[d.yes]=true;S.pend=null;S.rev=false}else if(d.un){delete S.kept[d.un];S.rev=false}else if(i=="go"){if(!S.ask.trim())return;const a=S.ask.trim();S.asks.push(a);S.ask="";S.ver++;S.rev=false;S.submitted=false;const m=a.match(/\b\d+\s*(years?|%)/i);if(m)S.flag=a}else if(i=="prev"){S.ver--;S.asks.pop();S.rev=false}else if(i=="rev"){S.rev=t.checked;if(!S.rev)S.submitted=false}else if(i=="sub")S.submitted=true;else return;render()});
render();
</script></body></html>
