<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PROTOTYPE 1: Profile setup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#1f2933;background:#f4f5f7;padding-bottom:140px}
header{background:#fff;border-bottom:1px solid #d9dde3;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}h2{font-size:16px;margin:0 0 8px}
main{padding:18px 20px;max-width:1180px;margin:auto}.card{background:#fff;border:1px solid #d9dde3;border-radius:8px;padding:16px;margin-bottom:12px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;background:#e4e7eb}.y{background:#fff3c4;color:#6b4e00}.g{background:#dff5e3;color:#14622a}
button{font:inherit;font-size:14px;padding:5px 12px;border:1px solid #9aa5b1;border-radius:6px;background:#fff;cursor:pointer;margin:2px 2px 2px 0}.primary{background:#1f5fbf;border-color:#1f5fbf;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid #f0a500;outline-offset:1px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 2px}label.i{display:inline-block;font-weight:400;font-size:14px;margin:4px 12px 0 0}input[type=text],select,textarea{font:inherit;width:100%;padding:6px 8px;border:1px solid #9aa5b1;border-radius:6px}
.muted{color:#52606d;font-size:13px}.drop{border:2px dashed #9aa5b1;border-radius:8px;padding:28px;text-align:center}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #e4e7eb}.row:first-child{border-top:0}
.narrow{max-width:640px;margin:auto}.track{height:6px;background:#e4e7eb;border-radius:3px;margin:8px 0 14px}.track div{height:100%;background:#1f5fbf;border-radius:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.side{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}.side nav{position:sticky;top:10px}.side nav a{display:block;padding:6px 8px;color:inherit;text-decoration:none;border-radius:6px}.side nav a:hover{background:#e4e7eb}
.paper{background:#fff;border:1px solid #d9dde3;padding:18px;font-family:Georgia,serif;min-height:380px}.hl{background:#e3edff;border-bottom:2px solid #1f5fbf;padding:0 2px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#1f2933;color:#fff;padding:8px 14px;font-size:13px}.bar button[aria-pressed=true]{background:#f0a500;border-color:#f0a500;font-weight:700}pre{background:#111;color:#b6f2c0;margin:6px 0 0;padding:6px 8px;font-size:12px;max-height:54px;overflow:auto;white-space:pre-wrap}
@media(max-width:820px){.two,.side{grid-template-columns:1fr}.side nav{position:static}}
</style></head><body>
<header><span class="badge y">PROTOTYPE: invented data, nothing is saved</span><h1>First-time Profile setup</h1><nav><a href="2-job-listings-PROTOTYPE.html">Next page: Job listings →</a></nav></header>
<main id="app"></main><div class="bar" role="region" aria-label="Layout switcher"><div id="sw"></div><pre id="state"></pre></div>
<script>
const S={v:new URLSearchParams(location.search).get("v")||"a",step:0,uploaded:false,github:"",extra:[],draft:"",auth:"",live:"",lang:"English",seniority:"",roles:"",arr:{Remote:true,Hybrid:false,"On-site":false},places:"",salary:"",type:"Employment and freelance",email:false,done:false};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const inp=(id,l,ph="",help="")=>`<label for="${id}">${l}</label><input type="text" id="${id}" data-b="${id}" value="${esc(S[id])}" placeholder="${ph}">${help?`<div class="muted">${help}</div>`:""}`;
const sel=(id,l,o)=>`<label for="${id}">${l}</label><select id="${id}" data-b="${id}"><option value="">Not set</option>${o.map(x=>`<option ${S[id]==x?"selected":""}>${x}</option>`).join("")}</select>`;
const Up=()=>S.uploaded?`<p><span class="badge g">Read</span> sam-rivera-resume.pdf: 1 role, 6 skills, 1 degree <button id="rm">Replace</button></p>`:`<div class="drop"><p>Upload your resume (PDF or DOCX)</p><button class="primary" id="up">Choose file (simulated)</button><div class="muted">Stays on your server. Used only as Evidence.</div></div>`;
const Gh=()=>inp("github","Public GitHub username (optional)","srivera","Public repos only.");
const Ev=()=>`${S.uploaded?["Python Developer, Example Co, 2021 to present","LangGraph, FastAPI, Postgres","BSc Computer Science"].map(x=>`<div class="row"><span>${x}</span><span class="badge">Resume</span></div>`).join(""):'<p class="muted">Nothing yet. Upload a resume or add entries below.</p>'}${S.extra.map(x=>`<div class="row"><span>${esc(x)}</span><span class="badge y">Self-reported</span></div>`).join("")}<label for="draft">Add something your resume misses</label><textarea id="draft" data-b="draft" rows="2" placeholder="I ran services on Kubernetes for 2 years.">${esc(S.draft)}</textarea><button id="addx">Add as self-reported</button>`;
const Facts=()=>`<p class="muted">Used to spot hard blockers. Empty fields show as Unknown, never as a blocker.</p>${sel("auth","Work authorization",["US citizen or permanent resident","Needs sponsorship","Other"])}${inp("live","Where you live","Austin, US")}${inp("lang","Languages")}${sel("seniority","Seniority",["Junior","Mid","Senior","Staff"])}`;
const Look=()=>`${inp("roles","Roles and keywords","GenAI engineer, LLM engineer")}${sel("type","Work type",["Employment and freelance","Employment only","Freelance only"])}<label>Location preference</label>${Object.keys(S.arr).map(k=>`<label class="i"><input type="checkbox" data-arr="${k}" ${S.arr[k]?"checked":""}> ${k}</label>`).join("")}${inp("places","Countries or cities","US, San Francisco","Filter hides postings outside these. You can still view them with the reason.")}${inp("salary","Minimum salary (optional)","120000")}`;
const Mail=()=>`<label class="i"><input type="checkbox" id="em" ${S.email?"checked":""}> Email me 14 days after I submit to ask if I heard back</label><p class="muted">Optional. Sends only to you through your own SMTP account, and names no employers or jobs. Job Copilot never reads your mailbox.</p>`;
const ready=()=>S.uploaded&&S.roles.trim();
const Finish=()=>S.done?`<div class="card"><span class="badge g">Profile saved</span> <a href="2-job-listings-PROTOTYPE.html">Go to job listings</a></div>`:`<button class="primary" id="fin" ${ready()?"":"disabled"}>Save and find jobs</button>${ready()?"":'<div class="muted">Needs a resume and at least one role.</div>'}`;
const STEPS=[["Your resume",()=>Up()+Gh()],["Check your Evidence",Ev],["Facts about you",Facts],["What you're looking for",Look],["Check-in email",Mail]];
const A=()=>`<div class="narrow"><div class="muted">Step ${S.step+1} of ${STEPS.length}</div><div class="track"><div style="width:${(S.step+1)/STEPS.length*100}%"></div></div><div class="card"><h2>${STEPS[S.step][0]}</h2>${STEPS[S.step][1]()}</div><button id="pv" ${S.step?"":"disabled"}>Back</button>${S.step<STEPS.length-1?'<button class="primary" id="nx">Next</button>':Finish()}</div>`;
const B=()=>`<div class="two"><div class="paper"><b>Your resume</b>${S.uploaded?`<p style="font-size:18px;margin:8px 0 0"><b>Sam Rivera</b></p><p>Python Developer, Example Co, 2021 to present</p><p><span class="hl">LangGraph</span>, <span class="hl">FastAPI</span>, <span class="hl">Postgres</span></p><p>BSc Computer Science</p><p class="muted" style="font-family:system-ui">Highlighted text became Evidence.</p>`:Up()}</div><div><div class="card"><h2>What we understood</h2>${Ev()}${S.uploaded?Gh():""}</div><div class="card"><h2>A few things your resume can't tell us</h2>${Facts()}${Look()}</div><div class="card">${Mail()}${Finish()}</div></div></div>`;
const secs=[["Resume",()=>Up()+Gh()],["Evidence",Ev],["Facts about you",Facts],["What you're looking for",Look],["Check-in email",Mail]];
const filled=i=>[S.uploaded,S.uploaded||S.extra.length>0,!!(S.auth&&S.live&&S.seniority),!!S.roles.trim(),S.email][i];
const C=()=>`<div class="side"><nav class="card" aria-label="Sections">${secs.map(([n],i)=>`<a href="#s${i}">${filled(i)?"✓":"○"} ${n}</a>`).join("")}<div style="margin-top:10px">${Finish()}</div></nav><div>${secs.map(([n,f],i)=>`<div class="card" id="s${i}"><h2>${n}</h2>${f()}</div>`).join("")}</div></div>`;
const V={a:A,b:B,c:C},L={a:"A: Guided steps",b:"B: Resume beside what we understood",c:"C: One page with checklist"};
function render(){if(!V[S.v])S.v="a";document.getElementById("app").innerHTML=V[S.v]();document.getElementById("sw").innerHTML=Object.entries(L).map(([k,l])=>`<button aria-pressed="${S.v==k}" data-v="${k}">${l}</button>`).join("");const {draft,...x}=S;document.getElementById("state").textContent=JSON.stringify(x)}
document.addEventListener("input",e=>{const b=e.target.dataset.b;if(b)S[b]=e.target.value});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.b&&t.id!="draft"){S[t.dataset.b]=t.value;render()}else if(t.dataset.arr){S.arr[t.dataset.arr]=t.checked;render()}else if(t.id=="em"){S.email=t.checked;render()}});
document.addEventListener("click",e=>{const t=e.target,d=t.dataset,i=t.id;if(d.v){S.v=d.v;history.replaceState(null,"","?v="+d.v)}else if(i=="up")S.uploaded=true;else if(i=="rm")S.uploaded=false;else if(i=="nx")S.step++;else if(i=="pv")S.step--;else if(i=="addx"){if(!S.draft.trim())return;S.extra.push(S.draft.trim());S.draft=""}else if(i=="fin")S.done=true;else return;render()});
render();
</script></body></html>
